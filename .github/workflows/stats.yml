name: Refresh profile stats
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SVGs
        env:
          # Add a fine-grained PAT (read-only: metadata on all repos) as PROFILE_STATS_TOKEN
          # to count private repos. Without it, only public data is counted.
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
        run: python3 scripts/generate.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile stats" && git push)
